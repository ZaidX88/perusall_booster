<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 340px; padding: 15px; font-family: sans-serif; }
    h3 { margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
    .toggle { position: relative; display: inline-block; width: 44px; height: 24px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #16a34a; }
    input:checked + .slider:before { transform: translateX(20px); }
    
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; margin-top: 10px;}
    select, input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px; }
    button { width: 100%; padding: 10px; background: #16a34a; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #15803d; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    
    .stats { margin-top: 15px; padding: 10px; background: #f0fdf4; border-radius: 4px; font-size: 12px; line-height: 1.6; }
    .stats strong { color: #166534; }
    #status { font-size: 12px; margin-top: 10px; min-height: 16px; text-align: center; }
    .note { font-size: 11px; color: #666; margin-bottom: 5px; }
  </style>
</head>
<body>
  <h3>⏱️ Increment Multiplier</h3>
  <!-- <p class="note">Enter a number to multiply the 'increment' parameter by.</p> -->
  
  <!-- <label for="multiplier">Multiplier Value:</label>
  <input type="number" id="multiplier" placeholder="e.g., 10" min="1"> -->

  <label for="preset">Preset:</label>
  <select id="preset">
    <option value="120">2x (120s)</option>
    <option value="180">3x (180s)</option>
    <option value="300">5x (300s)</option>
    <option value="600">10x (600s)</option>
    <option value="1200">20x (1200s)</option>
    <option value="random">Random</option>
  </select>
  
  
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
