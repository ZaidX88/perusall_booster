<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1f2937;
      margin: 0;
      background-color: #ffffff;
    }
    .header {
      margin-bottom: 16px;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 8px;
    }
    .header h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: #111827;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .toggle-label {
      font-size: 14px;
      font-weight: 500;
      color: #374151;
    }
    .toggle {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #16a34a;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    #status {
      font-size: 12px;
      min-height: 16px;
      text-align: center;
      margin-top: 8px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>Heartbeat Booster</h3>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Enable Booster</span>
    <label class="toggle">
      <input type="checkbox" id="enableToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
