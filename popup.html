<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 15px; font-family: sans-serif; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 15px; }
    button { width: 100%; padding: 10px; background: #16a34a; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #15803d; }
    #status { font-size: 12px; margin-top: 10px; min-height: 16px; text-align: center; }
    .note { font-size: 11px; color: #666; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h3>⏱️ Increment Multiplier</h3>
  <p class="note">Enter a number to multiply the 'increment' parameter by.</p>
  
  <label for="multiplier">Multiplier Value:</label>
  <input type="number" id="multiplier" placeholder="e.g., 10" min="1">
  
  <button id="btn-save"> Save & Activate</button>
  
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
